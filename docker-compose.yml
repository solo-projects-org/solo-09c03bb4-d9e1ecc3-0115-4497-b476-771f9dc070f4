services:
  pm25-planner:
    build: .
    image: pm25-planner:1.0.0
    container_name: pm25-planner
    ports:
      - "8000:8000"
    environment:
      # 默认扫描模式；如改用清单模式，指向容器内清单文件即可
      PM25_ARCHIVE_DIR: /data/archive
      # PM25_MANIFEST_PATH: /data/manifest/manifest.json
      PM25_COLUMN: pm25
      PM25_PREVIEW_MAX_FILES: "50"
      # 设为 1 时容器启动自动生成样例数据（仅当档案目录为空）
      GENERATE_SAMPLE: "1"
    volumes:
      - pm25-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pm25-data:
