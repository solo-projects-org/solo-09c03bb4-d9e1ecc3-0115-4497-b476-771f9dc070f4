services:
  pm25-planner:
    build: .
    image: pm25-planner:1.1.0
    container_name: pm25-planner
    ports:
      - "8000:8000"
    environment:
      PM25_ARCHIVE_DIR: /data/archive
      # 清单模式：抽查名单的“清单换版/文件与清单不符”检测都依赖该配置
      PM25_MANIFEST_PATH: /data/manifest/manifest.json
      PM25_COLUMN: pm25
      PM25_PREVIEW_MAX_FILES: "50"
      # 上次成功名单与对应快照的持久化目录（位于共享卷 data/state 下，重启后仍可查看）
      PM25_STATE_DIR: /data/state
      PM25_SAMPLE_MAX_INCREMENTAL_FILES: "256"
      # 设为 1 时容器启动自动生成样例数据（仅当档案目录为空）
      GENERATE_SAMPLE: "1"
    volumes:
      - pm25-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pm25-data:
